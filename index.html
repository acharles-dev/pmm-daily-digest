<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMM Daily Digest</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>PMM Daily Digest</h1>
        <p class="subtitle">Curated articles from top product marketing sources</p>
    </header>

    <main>
        <div class="stats" id="stats">
            <span id="stat-articles">-- articles</span>
            <span class="stat-sep">&middot;</span>
            <span id="stat-sources">-- sources</span>
            <span class="stat-sep">&middot;</span>
            <span id="stat-updated">Last updated: --</span>
        </div>

        <div class="filters" id="filters"></div>

        <div id="articles"></div>

        <div id="empty-state" class="empty-state" style="display:none;">
            <p>No articles collected yet.</p>
            <p>Run the workflow manually from the Actions tab or wait for the daily schedule.</p>
        </div>

        <div id="load-more-wrap" style="display:none;">
            <button id="load-more" class="load-more">Load more</button>
        </div>
    </main>

    <footer>
        <p>Articles collected daily via GitHub Actions from 8 RSS feeds.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
